name: Publicar jogo no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        run: |
          mkdir _site
          cp index.html style.css app.js engine.js treasure.js treasure.css chest-3d.js perguntas.json manifest.webmanifest sw.js _site/
          cp -r assets vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4


